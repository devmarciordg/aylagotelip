services:
  php:
    build: ./backend
    volumes:
      - ./backend:/var/www
    env_file: ./backend/.env
    depends_on: [mysql]

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www
      - ./backend/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [php]

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS:-root}
      MYSQL_DATABASE: ${DB_NAME:-gotelip}
      MYSQL_USER: ${DB_USER:-gotelip}
      MYSQL_PASSWORD: ${DB_PASS:-gotelip}
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql


volumes:
  dbdata:
